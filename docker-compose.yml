# Сборка с версией: deploy.sh передаёт коммит/ветку/время (видно в /version бота)
x-build: &app-build
  context: .
  args:
    GIT_COMMIT: ${GIT_COMMIT:-unknown}
    GIT_BRANCH: ${GIT_BRANCH:-unknown}
    BUILD_DATE: ${BUILD_DATE:-unknown}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовое применение миграций Alembic (bot стартует после успеха)
  migrate:
    build: *app-build
    command: alembic upgrade head
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  # Telegram-бот + планировщик (начисления, пеня, напоминания по задачам)
  bot:
    build: *app-build
    restart: unless-stopped
    command: python -m app.bot.runner
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

volumes:
  pg_data:
